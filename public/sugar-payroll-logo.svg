<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 44" width="260" height="44" role="img" aria-label="Sugar Payroll">
  <!-- 3x3 checkerboard mark (12px grid, 4px cells + 2px gutter) -->
  <g transform="translate(4 10)">
    <rect x="0" y="0" width="10" height="10" fill="#033222"/>
    <rect x="12" y="0" width="10" height="10" fill="#A6CCAB"/>
    <rect x="24" y="0" width="10" height="10" fill="#033222"/>
    <rect x="0" y="12" width="10" height="10" fill="#A6CCAB"/>
    <rect x="12" y="12" width="10" height="10" fill="#033222"/>
    <rect x="24" y="12" width="10" height="10" fill="#A6CCAB"/>
    <rect x="0" y="24" width="10" height="10" fill="#033222"/>
    <rect x="12" y="24" width="10" height="10" fill="#A6CCAB"/>
    <rect x="24" y="24" width="10" height="10" fill="#033222"/>
  </g>
  <!-- Wordmark -->
  <g font-family="'Plus Jakarta Sans', system-ui, -apple-system, Arial, sans-serif" fill="#17241C">
    <text x="46" y="29" font-size="20" font-weight="700" letter-spacing="-0.01em">Sugar</text>
    <text x="110" y="29" font-size="20" font-weight="700" letter-spacing="-0.01em" fill="#0B6F49">Payroll</text>
  </g>
</svg>
